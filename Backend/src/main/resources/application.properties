spring.application.name=EcoPortAPI

spring.datasource.url=jdbc:postgresql://postgres:5432/conport
spring.datasource.username=conport
spring.datasource.password=conport

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

file.upload-dir=/app/uploads/reports

spring.jpa.database-plataform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update